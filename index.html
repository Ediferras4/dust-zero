<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dustzero</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; background: #0b0b0f; color: #eee; }
  button { padding: 10px 16px; border-radius: 8px; border: 0; background: #4f7cff; color: #fff; cursor: pointer; font-size: 15px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .card { background: #16161d; border-radius: 12px; padding: 12px 14px; margin: 8px 0; display: flex; align-items: center; gap: 12px; }
  .info { flex: 1; min-width: 0; }
  .line { font-size: 13px; color: #aaa; margin-top: 2px; word-break: break-all; }
  .ok { color: #7bd88f; }
  .bad { color: #f0a500; }
  .logo { width: 36px; height: 36px; border-radius: 50%; background: #2a2a36; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #4f7cff; flex-shrink: 0; overflow: hidden; }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  #summary { font-size: 14px; color: #bbb; }
  #review { background: #16161d; border-radius: 12px; padding: 14px; margin-top: 16px; display: none; }
  #log { font-size: 12px; color: #aaa; white-space: pre-wrap; word-break: break-all; margin-top: 16px; }
  .muted { color: #888; }
</style>
</head>
<body>
<h1>dustzero</h1>
<p class="muted">Converte resíduos de tokens (de 0,05 a 5 USDC) em USDC na Arc mainnet. Até 10 tokens por vez.</p>

<button id="connect">Conectar carteira</button>
<p id="status"></p>
<p id="summary"></p>
<div id="list"></div>

<div id="review">
  <p><b>Selecionados:</b> <span id="selCount">0</span></p>
  <p><b>Você recebe (estimado):</b> <span id="recv">0</span> USDC</p>
  <p><b>Gas estimado:</b> <span id="gasEst">0</span> USDC</p>
  <button id="go">Confirmar consolidação</button>
</div>

<pre id="log"></pre>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<script>
// ===== CONFIGURAÇÃO =====
const ARC = {
  chainIdHex: '0x13b2', // 5042
  name: 'Arc',
  rpc: 'https://rpc.mainnet.arc.io',
  explorer: 'https://explorer.arc.io',
};

const CONFIG = {
  USDC:   '0x3600000000000000000000000000000000000000',
  ROUTER: '0xEA0129203FBB99ebEea3f78B2d05b924f17FB556', // AchSwap V3 Router
  QUOTER: '0x659Da32F3F10566bDB6B55Ad84c182f1D00Ba058', // AchSwap V3 QuoterV2
  FEES: [100, 500, 3000, 10000],
  MIN_VALUE_USDC: 0.05,
  MAX_VALUE_USDC: 5,
  MAX_PER_RUN: 10,
  SLIPPAGE_BPS: 300n, // 3%
  DEADLINE_SEC: 900,
  GAS_UNITS_BATCH: 400000n,
  GAS_UNITS_APPROVE: 60000n,
};

// ===== ABIs =====
const ERC20_ABI = [
  'function balanceOf(address) view returns (uint256)',
  'function allowance(address,address) view returns (uint256)',
  'function approve(address,uint256) returns (bool)',
];
const QUOTER_ABI = [
  'function quoteExactInputSingle((address tokenIn,address tokenOut,uint256 amountIn,uint24 fee,uint160 sqrtPriceLimitX96) params) returns (uint256 amountOut,uint160 sqrtPriceX96After,uint32 initializedTicksCrossed,uint256 gasEstimate)',
];
const ROUTER_ABI = [
  'function exactInputSingle((address tokenIn,address tokenOut,uint24 fee,address recipient,uint256 deadline,uint256 amountIn,uint256 amountOutMinimum,uint160 sqrtPriceLimitX96) params) payable returns (uint256 amountOut)',
  'function multicall(bytes[] data) payable returns (bytes[] results)',
];

// ===== ESTADO =====
let provider, signer, account, quoter, gasPrice = 0n;
let items = [];
const $ = id => document.getElementById(id);
const log = msg => { $('log').textContent += msg + '\n'; console.log(msg); };
const usdc = x => Number(ethers.formatUnits(x, 6)).toFixed(4);

// ===== CONEXÃO =====
async function connect() {
  if (!window.ethereum) { alert('Instale uma carteira como MetaMask.'); return; }
  try {
    await window.ethereum.request({ method: 'eth_requestAccounts' });
    try {
      await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: ARC.chainIdHex }] });
    } catch (e) {
      await window.ethereum.request({
        method: 'wallet_addEthereumChain',
        params: [{
          chainId: ARC.chainIdHex,
          chainName: ARC.name,
          rpcUrls: [ARC.rpc],
          nativeCurrency: { name: 'USDC', symbol: 'USDC', decimals: 18 },
          blockExplorerUrls: [ARC.explorer],
        }],
      });
    }
    provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();
    account = await signer.getAddress();
    quoter = new ethers.Contract(CONFIG.QUOTER, QUOTER_ABI, provider);
    $('status').textContent = 'Conectado: ' + account.slice(0, 6) + '...' + account.slice(-4);
    $('connect').disabled = true;
    await scan();
  } catch (e) {
    log('Erro ao conectar: ' + (e.shortMessage || e.message));
  }
}

// ===== LEITURA DA CARTEIRA VIA RPC =====
async function fetchTokens() {
  // Tokens conhecidos na Arc (adicione mais se quiser)
  const knownTokens = [
    {
      address: '0x171A4217b86A807A64eB94757Db6849fb4bDbAA0', // cirBTC
      symbol: 'cirBTC',
      name: 'Circle Wrapped Bitcoin',
      decimals: 8,
      logo: 'https://assets.coingecko.com/coins/images/102172745/standard/cirbtc.jpg',
      exchangeRate: 82000, // preço aproximado em USD (atualize se quiser)
    },
    // Exemplo de outros tokens que você pode adicionar:
    // { address: '0x...', symbol: 'EURC', name: 'Euro Coin', decimals: 6, exchangeRate: 1.08 },
  ];

  const results = [];

  for (const t of knownTokens) {
    try {
      const contract = new ethers.Contract(t.address, ERC20_ABI, provider);
      const bal = await contract.balanceOf(account);
      if (bal > 0n) {
        results.push({
          ...t,
          raw: bal,
        });
        log(`${t.symbol}: saldo encontrado = ${ethers.formatUnits(bal, t.decimals)}`);
      }
    } catch (e) {
      log(`Erro ao ler ${t.symbol}: ${e.message}`);
    }
  }
  return results;
}

// ===== COTAÇÃO =====
async function quoteBest(tokenIn, amountIn, symbol) {
  let best = null;
  for (const fee of CONFIG.FEES) {
    try {
      const r = await quoter.quoteExactInputSingle.staticCall({
        tokenIn,
        tokenOut: CONFIG.USDC,
        amountIn,
        fee,
        sqrtPriceLimitX96: 0,
      });
      const out = r[0];
      log(`${symbol} fee ${fee}: ${usdc(out)} USDC`);
      if (out > 0n && (!best || out > best.out)) {
        best = { out, fee };
      }
    } catch (e) {
      log(`${symbol} fee ${fee}: sem pool`);
    }
  }
  return best;
}

// ===== VARREDURA =====
async function scan() {
  if (!account) return;
  $('list').innerHTML = '<p class="muted">Lendo carteira...</p>';
  items = [];
  try {
    const feeData = await provider.getFeeData();
    gasPrice = feeData.gasPrice ?? 0n;

    const tokens = await fetchTokens();

    for (const t of tokens) {
      const row = { 
        ...t, 
        out: 0n, 
        fee: 0, 
        reason: '', 
        selected: false, 
        estimatedUSDC: 0 
      };

      // Calcula valor usando o exchangeRate
      const amount = Number(ethers.formatUnits(t.raw, t.decimals));
      row.estimatedUSDC = amount * (t.exchangeRate || 0);
      log(`${t.symbol}: valor estimado = \[ {row.estimatedUSDC.toFixed(4)}`);

      // Tenta cotar no Quoter para pegar o fee tier real
      const best = await quoteBest(t.address, t.raw, t.symbol);
      if (best) {
        row.out = best.out;
        row.fee = best.fee;
      }

      // Decide elegibilidade
      if (row.estimatedUSDC < CONFIG.MIN_VALUE_USDC) {
        row.reason = `Valor abaixo de ${CONFIG.MIN_VALUE_USDC} USDC`;
      } else if (row.estimatedUSDC > CONFIG.MAX_VALUE_USDC) {
        row.reason = `Valor acima de ${CONFIG.MAX_VALUE_USDC} USDC`;
      } else if (!best) {
        row.reason = 'Sem pool / liquidez insuficiente';
      }

      items.push(row);
    }
  } catch (e) {
    log('Erro ao ler carteira: ' + (e.shortMessage || e.message));
  }
  render();
}

// ===== INTERFACE =====
function render() {
  const box = $('list');
  box.innerHTML = '';
  
  if (!items.length) {
    box.innerHTML = '<p class="muted">Nenhum token encontrado nesta carteira.</p>';
    $('summary').textContent = '';
    updateReview();
    return;
  }

  const elig = items.filter(i => !i.reason).length;
  $('summary').textContent = `Tokens: ${items.length} · Elegíveis: ${elig} · Não elegíveis: ${items.length - elig}`;

  for (const it of items) {
    const div = document.createElement('div');
    div.className = 'card';

    const logo = document.createElement('div');
    logo.className = 'logo';
    if (it.logo) {
      const img = document.createElement('img');
      img.src = it.logo;
      img.onerror = () => { logo.textContent = it.symbol[0]; };
      logo.append(img);
    } else {
      logo.textContent = it.symbol[0];
    }

    const info = document.createElement('div');
    info.className = 'info';

    const name = document.createElement('b');
    name.textContent = `${it.symbol} · ${it.name}`;

    const saldo = document.createElement('div');
    saldo.className = 'line';
    saldo.textContent = `Saldo: ${ethers.formatUnits(it.raw, it.decimals)} ${it.symbol}`;

    const valor = document.createElement('div');
    valor.className = 'line';
    valor.textContent = `Valor estimado: \]{it.estimatedUSDC.toFixed(4)}` + (it.fee ? ` · fee ${it.fee/10000}%` : '');

    info.append(name, saldo, valor);

    if (it.reason) {
      const motivo = document.createElement('div');
      motivo.className = 'line bad';
      motivo.textContent = 'Não elegível: ' + it.reason;
      info.append(motivo);
    } else {
      const ok = document.createElement('div');
      ok.className = 'line ok';
      ok.textContent = 'Elegível';
      info.append(ok);
    }

    div.append(logo, info);

    if (!it.reason) {
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = it.selected;
      cb.onchange = () => { it.selected = cb.checked; updateReview(); };
      div.append(cb);
    }
    box.append(div);
  }
  updateReview();
}

function selected() {
  return items.filter(i => i.selected && !i.reason).slice(0, CONFIG.MAX_PER_RUN);
}

function updateReview() {
  const sel = selected();
  const total = sel.reduce((a, i) => a + i.estimatedUSDC, 0);
  const gasUnits = CONFIG.GAS_UNITS_BATCH + BigInt(sel.length) * CONFIG.GAS_UNITS_APPROVE;
  const gas = Number(ethers.formatUnits(gasPrice * gasUnits, 18));
  
  $('selCount').textContent = sel.length;
  $('recv').textContent = total.toFixed(4);
  $('gasEst').textContent = gas.toFixed(4);
  $('review').style.display = sel.length ? 'block' : 'none';
  $('go').disabled = !sel.length;
}

// ===== EXECUÇÃO =====
async function executeBatch() {
  const sel = selected();
  if (!sel.length) return;
  $('go').disabled = true;
  
  try {
    // Aprovações
    for (const t of sel) {
      const token = new ethers.Contract(t.address, ERC20_ABI, signer);
      const allowance = await token.allowance(account, CONFIG.ROUTER);
      if (allowance < t.raw) {
        log(`Aprovando ${t.symbol}...`);
        const txA = await token.approve(CONFIG.ROUTER, t.raw);
        await txA.wait();
        log(`${t.symbol} aprovado`);
      }
    }

    const deadline = Math.floor(Date.now() / 1000) + CONFIG.DEADLINE_SEC;
    const iface = new ethers.Interface(ROUTER_ABI);
    
    const calls = sel.map(t => {
      const minOut = t.out > 0n 
        ? (t.out * (10000n - CONFIG.SLIPPAGE_BPS)) / 10000n 
        : 0n;
        
      return iface.encodeFunctionData('exactInputSingle', [{
        tokenIn: t.address,
        tokenOut: CONFIG.USDC,
        fee: t.fee || 3000,
        recipient: account,
        deadline,
        amountIn: t.raw,
        amountOutMinimum: minOut,
        sqrtPriceLimitX96: 0,
      }]);
    });

    const router = new ethers.Contract(CONFIG.ROUTER, ROUTER_ABI, signer);
    log(`Enviando lote com ${calls.length} troca(s)...`);
    const tx = await router.multicall(calls);
    log(`Transação enviada: ${tx.hash}`);
    await tx.wait();
    log('Concluído com sucesso!');
    await scan();
  } catch (e) {
    log('Erro: ' + (e.shortMessage || e.message));
  } finally {
    $('go').disabled = false;
  }
}

$('connect').onclick = connect;
$('go').onclick = executeBatch;
</script>
</body>
</html>
