<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dustzero</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; background: #0b0b0f; color: #eee; }
  button { padding: 10px 16px; border-radius: 8px; border: 0; background: #4f7cff; color: #fff; cursor: pointer; font-size: 15px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .card { background: #16161d; border-radius: 12px; padding: 12px 14px; margin: 8px 0; display: flex; align-items: center; gap: 12px; }
  .info { flex: 1; }
  .muted { color: #999; font-size: 13px; }
  .bad { color: #f0a500; font-size: 13px; }
  .logo { width: 36px; height: 36px; border-radius: 50%; background: #2a2a36; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #4f7cff; flex-shrink: 0; }
  #review { background: #16161d; border-radius: 12px; padding: 14px; margin-top: 16px; display: none; }
  #log { font-size: 13px; color: #aaa; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h1>dustzero</h1>
<p class="muted">Converte resíduos de tokens (de 0,05 a 5 USDC) em USDC na Arc mainnet. Até 10 tokens por vez.</p>

<button id="connect">Conectar carteira</button>
<p id="status" class="muted"></p>
<div id="list"></div>

<div id="review">
  <p><b>Selecionados:</b> <span id="selCount">0</span></p>
  <p><b>Você recebe (estimado):</b> <span id="recv">0</span> USDC</p>
  <p><b>Gas estimado:</b> <span id="gasEst">0</span> USDC</p>
  <button id="go">Confirmar consolidação</button>
</div>

<pre id="log"></pre>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<script>
// ===== CONFIGURAÇÃO (endereços confirmados no explorer.arc.io) =====
const ARC = {
  chainIdHex: '0x13b2', // 5042
  name: 'Arc',
  rpc: 'https://rpc.mainnet.arc.io',
  explorer: 'https://explorer.arc.io',
};

const CONFIG = {
  USDC:   '0x3600000000000000000000000000000000000000', // USDC na Arc (6 casas no ERC-20)
  ROUTER: '0xEA0129203FBB99ebEea3f78B2d05b924f17FB556', // AchSwapV3Router (verificado)
  QUOTER: '0x659Da32F3F10566bDB6B55Ad84c182f1D00Ba058', // AchSwapV3QuoterV2 (verificado)
  FEES: [100, 500, 3000, 10000],
  MIN_VALUE_USDC: 0.05,
  MAX_VALUE_USDC: 5,
  MAX_PER_RUN: 10,
  SLIPPAGE_BPS: 300n,       // 3%
  DEADLINE_SEC: 900,        // 15 minutos
  GAS_UNITS_BATCH: 400000n, // estimativa do lote
  GAS_UNITS_APPROVE: 60000n,
  // Adicione os endereços dos tokens que você quer verificar
  TOKENS: [
    // { address: '0x...' },
  ],
};

// ===== ABIs =====
const ERC20_ABI = [
  'function balanceOf(address) view returns (uint256)',
  'function allowance(address,address) view returns (uint256)',
  'function approve(address,uint256) returns (bool)',
  'function decimals() view returns (uint8)',
  'function symbol() view returns (string)',
];
const QUOTER_ABI = [
  'function quoteExactInputSingle((address tokenIn,address tokenOut,uint256 amountIn,uint24 fee,uint160 sqrtPriceLimitX96) params) returns (uint256 amountOut,uint160 sqrtPriceX96After,uint32 initializedTicksCrossed,uint256 gasEstimate)',
];
const ROUTER_ABI = [
  'function exactInputSingle((address tokenIn,address tokenOut,uint24 fee,address recipient,uint256 deadline,uint256 amountIn,uint256 amountOutMinimum,uint160 sqrtPriceLimitX96) params) payable returns (uint256 amountOut)',
  'function multicall(bytes[] data) payable returns (bytes[] results)',
];

// ===== ESTADO =====
let provider, signer, account, quoter, gasPrice = 0n;
let items = [];
const $ = id => document.getElementById(id);
const log = msg => { $('log').textContent += msg + '\n'; };
const fmt = (x, dec) => Number(ethers.formatUnits(x, dec)).toFixed(4);

// ===== CONEXÃO =====
async function connect() {
  if (!window.ethereum) { alert('Instale uma carteira como MetaMask.'); return; }
  try {
    await window.ethereum.request({ method: 'eth_requestAccounts' });
    try {
      await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: ARC.chainIdHex }] });
    } catch (e) {
      await window.ethereum.request({
        method: 'wallet_addEthereumChain',
        params: [{
          chainId: ARC.chainIdHex,
          chainName: ARC.name,
          rpcUrls: [ARC.rpc],
          nativeCurrency: { name: 'USDC', symbol: 'USDC', decimals: 18 },
          blockExplorerUrls: [ARC.explorer],
        }],
      });
    }
    provider = new ethers.BrowserProvider(window.ethereum);
    signer = await provider.getSigner();
    account = await signer.getAddress();
    quoter = new ethers.Contract(CONFIG.QUOTER, QUOTER_ABI, provider);
    $('status').textContent = 'Conectado: ' + account.slice(0, 6) + '...' + account.slice(-4);
    $('connect').disabled = true;
    await scan();
  } catch (e) {
    log('Erro ao conectar: ' + (e.shortMessage || e.message));
  }
}

// ===== COTAÇÃO: testa as fee tiers e fica com a melhor =====
async function quoteBest(tokenIn, amountIn) {
  let best = null;
  for (const fee of CONFIG.FEES) {
    try {
      const r = await quoter.quoteExactInputSingle.staticCall({
        tokenIn, tokenOut: CONFIG.USDC, amountIn, fee, sqrtPriceLimitX96: 0,
      });
      const out = r[0];
      if (out > 0n && (!best || out > best.out)) best = { out, fee };
    } catch (e) { /* sem pool nessa fee */ }
  }
  return best;
}

// ===== VARREDURA DOS TOKENS =====
async function scan() {
  if (!account) return;
  $('list').innerHTML = '<p class="muted">Lendo carteira...</p>';
  items = [];
  const feeData = await provider.getFeeData();
  gasPrice = feeData.gasPrice ?? 0n;

  for (const t of CONFIG.TOKENS) {
    try {
      const c = new ethers.Contract(t.address, ERC20_ABI, provider);
      const [bal, dec, sym] = await Promise.all([c.balanceOf(account), c.decimals(), c.symbol()]);
      if (bal === 0n) continue;

      const row = { address: t.address, symbol: sym, bal, dec, out: 0n, fee: 0, reason: '', selected: false };
      const best = await quoteBest(t.address, bal);
      if (!best) {
        row.reason = 'Sem pool ou sem liquidez';
      } else {
        row.out = best.out;
        row.fee = best.fee;
        const v = Number(ethers.formatUnits(best.out, 6));
        if (v < CONFIG.MIN_VALUE_USDC) row.reason = 'Abaixo de 0,05 USDC';
        else if (v > CONFIG.MAX_VALUE_USDC) row.reason = 'Acima de 5 USDC';
      }
      items.push(row);
    } catch (e) {
      log('Erro em ' + t.address + ': ' + (e.shortMessage || e.message));
    }
  }
  render();
}

// ===== INTERFACE =====
function render() {
  const box = $('list');
  box.innerHTML = '';
  if (!items.length) {
    box.innerHTML = '<p class="muted">Nenhum token com saldo nos endereços configurados.</p>';
    updateReview();
    return;
  }
  const elig = items.filter(i => !i.reason).length;
  const summary = document.createElement('p');
  summary.className = 'muted';
  summary.textContent = 'Elegíveis: ' + elig + ' · Não elegíveis: ' + (items.length - elig);
  box.append(summary);

  for (const it of items) {
    const div = document.createElement('div');
    div.className = 'card';

    const logo = document.createElement('div');
    logo.className = 'logo';
    logo.textContent = it.symbol.slice(0, 1).toUpperCase();

    const info = document.createElement('div');
    info.className = 'info';
    const name = document.createElement('b');
    name.textContent = it.symbol;
    const detail = document.createElement('div');
    detail.className = it.reason ? 'bad' : 'muted';
    detail.textContent = it.reason
      ? it.reason
      : 'Saldo ' + fmt(it.bal, it.dec) + ' · ~' + fmt(it.out, 6) + ' USDC';
    info.append(name, detail);

    div.append(logo, info);

    if (!it.reason) {
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = it.selected;
      cb.onchange = () => { it.selected = cb.checked; updateReview(); };
      div.append(cb);
    }
    box.append(div);
  }
  updateReview();
}

function selected() {
  return items.filter(i => i.selected && !i.reason).slice(0, CONFIG.MAX_PER_RUN);
}

function updateReview() {
  const sel = selected();
  const total = sel.reduce((a, i) => a + i.out, 0n);
  const gasUnits = CONFIG.GAS_UNITS_BATCH + BigInt(sel.length) * CONFIG.GAS_UNITS_APPROVE;
  const gas = (gasPrice * gasUnits) / 1000000000000n; // gas usa 18 casas; USDC ERC-20 usa 6

  $('selCount').textContent = sel.length;
  $('recv').textContent = fmt(total, 6);
  $('gasEst').textContent = fmt(gas, 6);
  $('review').style.display = sel.length ? 'block' : 'none';
  $('go').disabled = !sel.length;
}

// ===== EXECUÇÃO: aprovações + um lote (multicall) =====
async function executeBatch() {
  const sel = selected();
  if (!sel.length) return;
  $('go').disabled = true;
  try {
    // 1) Aprovação por token (uma transação cada, só se faltar allowance)
    for (const t of sel) {
      const token = new ethers.Contract(t.address, ERC20_ABI, signer);
      const allowance = await token.allowance(account, CONFIG.ROUTER);
      if (allowance < t.bal) {
        log('Aprovando ' + t.symbol + '...');
        const txA = await token.approve(CONFIG.ROUTER, t.bal);
        await txA.wait();
      }
    }

    // 2) Monta as trocas e envia tudo num multicall
    const deadline = Math.floor(Date.now() / 1000) + CONFIG.DEADLINE_SEC;
    const iface = new ethers.Interface(ROUTER_ABI);
    const calls = sel.map(t => {
      const minOut = (t.out * (10000n - CONFIG.SLIPPAGE_BPS)) / 10000n;
      return iface.encodeFunctionData('exactInputSingle', [{
        tokenIn: t.address,
        tokenOut: CONFIG.USDC,
        fee: t.fee,
        recipient: account,
        deadline,
        amountIn: t.bal,
        amountOutMinimum: minOut,
        sqrtPriceLimitX96: 0,
      }]);
    });

    const router = new ethers.Contract(CONFIG.ROUTER, ROUTER_ABI, signer);
    log('Enviando lote com ' + calls.length + ' troca(s)...');
    const tx = await router.multicall(calls);
    log('Enviado: ' + tx.hash);
    await tx.wait();
    log('Concluído. Se alguma troca falhar, o lote inteiro é revertido.');
    await scan();
  } catch (e) {
    log('Erro: ' + (e.shortMessage || e.message));
  } finally {
    $('go').disabled = false;
  }
}

$('connect').onclick = connect;
$('go').onclick = executeBatch;
</script>
</body>
</html>
